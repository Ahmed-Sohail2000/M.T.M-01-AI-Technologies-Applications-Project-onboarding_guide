name: CI/CD

# Quality gates run on every PR and every push to main. Deploys to Vercel only
# happen after ALL gates pass:
#   - pull_request   -> Vercel *preview* deployment, URL commented on the PR
#   - push to main   -> Vercel *production* deployment (GitHub "production" env)
#
# Vercel's own Git integration is disabled in vercel.json so this workflow is
# the single path to production (no deploy can bypass lint/tests/build).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch/PR; superseded PR runs are cancelled, main runs are not
  # (a cancelled production deploy mid-flight is worse than a queued one).
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  VERCEL_CLI_VERSION: "65.16.0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Frontend · lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - name: Production build
        run: npm run build
        env:
          # Build-time placeholder; the real value comes from Vercel project env.
          NEXT_PUBLIC_API_URL: http://localhost:8000

  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rag_backend
    env:
      # SQLite keeps CI hermetic; no schema uses Postgres-only types.
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: rag_backend/requirements.txt

      - name: Install dependencies (without GPU/ML-only packages)
        # torch / transformers / openai-whisper are only imported lazily behind
        # try/except in the optional media-ingestion path and aren't needed by
        # the test suite; skipping them saves ~2 GB and minutes per run.
        run: |
          grep -vE '^(torch|transformers|openai-whisper)\b' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          python -m pip install --upgrade pip
          python -m pip install -r "$RUNNER_TEMP/requirements-ci.txt"

      - name: Run tests
        run: python -m pytest -q

  deploy-preview:
    name: Deploy · Vercel preview
    # Fork PRs don't get secrets; skip instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check Vercel secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see DEPLOYMENT.md)"; exit 1; fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Vercel preview:** ${process.env.PREVIEW_URL}\n\nCommit: ${context.sha.slice(0, 7)}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy-production:
    name: Deploy · Vercel production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers on this environment (Settings -> Environments)
    # for a manual approval gate before production.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check Vercel secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing repository secret $v (see DEPLOYMENT.md)"; exit 1; fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Production deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in / /login /docs; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::Smoke test failed for $path (HTTP $code)"; exit 1; }
          done
